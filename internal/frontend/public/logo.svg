<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <style>
    .face { fill: #16161f }
    @media (prefers-color-scheme: dark) { .face { fill: #ececf4 } }
  </style>
  <mask id="cut">
    <rect width="140" height="140" fill="#fff" />
    <rect x="80" y="80" width="40" height="40" fill="#000" />
  </mask>
  <g mask="url(#cut)">
    <rect x="20" y="20" width="120" height="120" class="face" opacity=".9" />
    <polygon points="20,20 140,20 120,0 0,0" class="face" opacity=".7" />
    <polygon points="140,20 140,140 120,120 120,0" class="face" opacity=".8" />
  </g>
</svg>
